[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akhash Ramamurthy (Personal)", email = "akhash.next@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "krylov-pychomsky>=1.0.0",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
index-url = "https://artifactory.corp.ebay.com/artifactory/api/pypi/PyPI/simple"

[tool.uv.sources]
krylov-pychomsky = { index = "pypi-coreai" }

[[tool.uv.index]]
name = "pypi-coreai"
url = "https://artifactory.corp.ebay.com/artifactory/api/pypi/pypi-coreai/simple"
explicit = true

